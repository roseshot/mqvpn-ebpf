# HAProxy Community: TLS/TCP pass-through for mqvpn TCP fallback.
# The Client MUST use transport: tcp and tcp_port: 443.
# No TLS termination: end-to-end Client mTLS is verified by mqvpn-server.
global
    log stdout format raw local0
    maxconn 20000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend mqvpn_tcp
    bind :443
    default_backend mqvpn_tcp_servers

backend mqvpn_tcp_servers
    mode tcp
    option tcp-check
    # Socket reachability is NOT application/mTLS/routing health.
    server site_primary 10.10.0.11:443 check inter 2s fall 3 rise 2
    server site_standby 10.10.0.12:443 check inter 2s fall 3 rise 2 backup
