# Example: Keepalived VRRP primary. Adapt interface, local/peer underlay
# addresses and VIP. Requires a real HA topology sharing L2/VRRP reachability.
# Install mqvpn-ready.sh at /usr/local/libexec/mqvpn-ready (0755).
global_defs {
    router_id MQVPN_1
    enable_script_security
    script_user root
}
vrrp_script chk_mqvpn {
    script "/usr/local/libexec/mqvpn-ready"
    interval 2
    timeout 1
    fall 2
    rise 2
    weight 0  # fail closed: go FAULT when health probe fails
}
vrrp_instance VI_MQVPN {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    nopreempt
    unicast_src_ip 192.0.2.11
    unicast_peer {
        192.0.2.12
    }
    virtual_ipaddress {
        192.0.2.100/24 dev eth0
    }
    track_script {
        chk_mqvpn
    }
}
