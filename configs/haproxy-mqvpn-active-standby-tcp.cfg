# HAProxy Community: active/standby for opaque TLS/TCP VPN streams.
# Server cert/SNI and mTLS peer authorizations remain end-to-end.
# The Client still sees only one Server hostname or VIP.
global
    log stdout format raw local0
    maxconn 10000
defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
frontend mqvpn_vip
    bind :443
    default_backend mqvpn_servers
backend mqvpn_servers
    option tcp-check
    server primary 10.0.0.11:443 check inter 2s fall 3 rise 2
    server standby 10.0.0.12:443 check inter 2s fall 3 rise 2 backup
