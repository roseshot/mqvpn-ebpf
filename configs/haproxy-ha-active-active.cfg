# HAProxy Community: distribute independent Client TCP/TLS VPN sessions.
# QUIC/UDP cannot be transparently passed by this mode tcp frontend.
global
    log stdout format raw local0
    maxconn 20000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend mqvpn_tcp
    bind :443
    default_backend mqvpn_tcp_servers

backend mqvpn_tcp_servers
    mode tcp
    option tcp-check
    balance roundrobin
    # Connections are sticky to one backend until they close.
    server site_a 10.10.0.11:443 check inter 2s fall 3 rise 2
    server site_b 10.10.0.12:443 check inter 2s fall 3 rise 2
