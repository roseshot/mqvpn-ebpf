# Example: Keepalived VRRP backup. Pair with primary sample.
# Adapt interface, addresses, routability and keepalived fencing.
global_defs {
    router_id MQVPN_2
    enable_script_security
    script_user root
}
vrrp_script chk_mqvpn {
    script "/usr/local/libexec/mqvpn-ready"
    interval 2
    timeout 1
    fall 2
    rise 2
    weight 0
}
vrrp_instance VI_MQVPN {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1
    nopreempt
    unicast_src_ip 192.0.2.12
    unicast_peer {
        192.0.2.11
    }
    virtual_ipaddress {
        192.0.2.100/24 dev eth0
    }
    track_script {
        chk_mqvpn
    }
}
