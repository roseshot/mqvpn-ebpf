# One UDP/QUIC listener shared by every VPN Instance.
# DNS names below must resolve to the same host and match TLS certificate SAN.
# listen: "0.0.0.0:443"  # Optional: default UDP/443

# Optional: explicitly list WAN NICs (important for multi-uplink servers).
# Defaults to the local public bind IP interface or main-table default route.
# wan_interfaces: [enp1s0, enp2s0]
# Automatic TUN MTU <= 1400; local WAN IPv4 MTU 1500 -> TUN 1400,
# max_frame 1414. Omit mtu/max_frame for auto sizing.

# Optional TCP/443 fallback. Independent TCP and UDP sockets can share 443.
# tcp_fallback:
#   enabled: true
#   listen: "0.0.0.0:443"  # optional; defaults to TCP/443

# TUN address CIDR automatically creates a normal Linux connected route.
# For overlapping subnets, preattach persistent TUNs to independent VRFs.
# mtu: 1360 + max_frame: 1374 can be enabled if WAN path MTU supports it.

# Optional: pure-Go statistics-only XDP controller; always XDP_PASS.
# Uses the ELF embedded in the server binary unless object overrides it.
# xdp:
#   interfaces: [enp1s0, enp2s0]
#   mode: driver

instances:
  - name: customer-a
    server_name: customer-a.vpn.example.com
    tun: mq0
    address: 10.77.0.1/24
    # Optional dynamic Tunnel IP assignment: pool must equal the TUN
    # connected prefix. Uses routed TUN local/32 + peer-subnet semantics
    # so even subnet .0 and .255 may be assigned as unicast host IPs.
    # Enable dynamic_tunnel_ip per authorized peer in peers YAML.
    # tunnel_pool: 10.77.0.0/24
    # TCX defaults to bundled ELF, auto MSS clamp and stats.
    # No runtime .o file is required; explicit object is an override.
    # tc:
    #   mode: auto      # off | auto | required
    #   mss_clamp: auto
    #   stats: true
    peers: /etc/mqvpn/peers-a.yaml
    path: /.well-known/masque/ethernet/
    cert: /etc/mqvpn/tls/a-server.crt
    key: /etc/mqvpn/tls/a-server.key
    client_ca: /etc/mqvpn/tls/a-clients.crt

  - name: customer-b
    server_name: customer-b.vpn.example.com
    tun: mq1
    address: 10.77.0.1/24  # overlapping VPN segment; separate VRF
    peers: /etc/mqvpn/peers-b.yaml
    path: /.well-known/masque/ethernet/
    cert: /etc/mqvpn/tls/b-server.crt
    key: /etc/mqvpn/tls/b-server.key
    client_ca: /etc/mqvpn/tls/b-clients.crt
