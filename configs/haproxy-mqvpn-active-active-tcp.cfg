# HAProxy Community: active/active for independent TLS/TCP VPN sessions.
# NO TLS termination: each backend verifies the original Client mTLS.
# The Client's existing transport: tcp and endpoint address are UNCHANGED.
# This does not transparently balance QUIC/UDP.
global
    log stdout format raw local0
    maxconn 10000
defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
frontend mqvpn_vip
    bind :443
    default_backend mqvpn_servers
backend mqvpn_servers
    balance roundrobin
    # Check real mqvpn readiness via local-node health port exposed only
    # through a protected management network/proxy, NOT a public endpoint.
    # For public-only setups use TCP checks and supplement with external
    # end-to-end probes. Reachability is not full tunnel readiness.
    option tcp-check
    server node_a 10.0.0.11:443 check inter 2s fall 3 rise 2
    server node_b 10.0.0.12:443 check inter 2s fall 3 rise 2
