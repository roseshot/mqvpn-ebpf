# Required Client settings: tenant DNS identity and mTLS files.
# Server-assigned TUN IP (requires tunnel_pool and peer dynamic_tunnel_ip).
# Default path, TUN mq0, WAN source, MTU, transport and bundled eBPF are auto.
server: customer-a.vpn.example.com
# address: 10.77.0.2/24  # optional static TUN CIDR
ca: /etc/mqvpn/a-ca.crt
cert: /etc/mqvpn/a-client.crt
key: /etc/mqvpn/a-client.key

# Advanced optional overrides (uncomment only as required):
# path: /corp/masque/connect/      # default /.well-known/masque/ethernet/
# accept_routes: false            # default true; Server-pushed routes
# accept_dns: false               # default true; Server-pushed DNS via resolved or resolvconf
# dns_routes: false               # default true; install DNS /32 IPv4 or /128 IPv6 routes
# reconnect: false                # default true; auto-retry after disconnect
# connect_ip: 198.51.100.10        # pin remote UDP/TCP destination
# wans:                           # ordered physical WAN paths (optional)
#   - source_ip: 192.0.2.10
#     interface: enp1s0
#   - source_ip: 198.51.100.10
#     interface: wwan0
# tun: mq0
# mtu: 1360
# max_frame: 1374
# transport: auto                  # auto | quic | tcp
# udp_dial_timeout: 5s
# tcp_port: 443
# tc:
#   mode: auto                     # off | auto | required
#   mss_clamp: auto
#   stats: true
