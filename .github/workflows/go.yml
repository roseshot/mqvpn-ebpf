name: Go

# PRs run once. Feature-branch pushes previously duplicated pull_request jobs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR revisions; do not cancel other PRs.
concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Temporary toolchain export: gofmt and go mod tidy generate the
  # canonical sources/checksums in the same Go 1.27 CI environment.
  # The output is consumed in the next repository commit, after which
  # this job is replaced by strict format/module verification.
  modernize-export:
    name: Export gofmt and go.sum for modernization
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Generate canonical Go formatting and module checksums
        env:
          CGO_ENABLED: "0"
        run: |
          go mod tidy
          echo __MQVPN_MOD_BEGIN__
          base64 -w76 go.mod
          echo __MQVPN_MOD_END__
          echo __MQVPN_SUM_BEGIN__
          base64 -w76 go.sum
          echo __MQVPN_SUM_END__
          mapfile -t files < <(gofmt -l cmd internal | LC_ALL=C sort)
          echo "formatting ${#files[@]} Go files"
          for path in "${files[@]}"; do
            echo "__MQVPN_GOFILE_BEGIN__ $path"
            gofmt "$path" | base64 -w76
            echo "__MQVPN_GOFILE_END__ $path"
          done

  native:
    name: Native Go (CGO=0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # The repository does not check in go.sum yet.
          cache-dependency-path: go.mod
      - name: Build self-contained binaries, test and vet without CGO
        env:
          CGO_ENABLED: "0"
        run: |
          make release
          go test -mod=mod ./...
          go vet -mod=mod ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      # Go's race detector requires CGO on Linux.
      - name: Race test
        env:
          CGO_ENABLED: "1"
        run: go test -mod=mod -race ./...

  bpf:
    name: eBPF ELF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install BPF compile headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-libc-dev
      - name: Compile and refresh embedded XDP/TCX ELF objects
        run: make bpf
      - name: Verify embedded objects are up to date with C source
        run: git diff --exit-code -- internal/tcebpf/objects/tun_tc.o internal/xdp/objects/xdp_mqvpn.o
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Verify TCX MSS rewrite and checksums in the kernel
        run: |
          sudo modprobe tun || true
          test -c /dev/net/tun
          sudo env "PATH=$PATH" "HOME=$HOME" CGO_ENABLED=0 go test -mod=mod -tags bpf_integration -run '^TestKernel' -v ./internal/tcebpf

  tun-integration:
    name: Linux TUN connected-route integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Enable Linux TUN and verify kernel connected route
        run: |
          sudo modprobe tun || true
          test -c /dev/net/tun
          sudo env "PATH=$PATH" "HOME=$HOME" CGO_ENABLED=0 go test -mod=mod -tags tun_integration -run '^TestIntegration' -v ./internal/tun
