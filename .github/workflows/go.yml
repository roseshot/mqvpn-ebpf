name: Go

# PRs run once. Feature-branch pushes previously duplicated pull_request jobs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR revisions; do not cancel other PRs.
concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Go format and module integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Enforce gofmt across all application and test code
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            printf 'Go files requiring gofmt:\n%s\n' "$files"
            gofmt -d internal/app/client_crl_test.go internal/p2mp/config_test.go
            exit 1
          fi
      - name: Verify reproducible Go modules
        run: |
          go mod tidy -diff
          go mod verify
      - name: Check local documentation links and heading anchors
        run: python3 scripts/check-doc-links.py

  native:
    name: Native Go (CGO=0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build self-contained binaries, test and vet without CGO
        env:
          CGO_ENABLED: "0"
        run: |
          make release
          go test -mod=readonly ./...
          go vet -mod=readonly ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Go's race detector requires CGO on Linux.
      - name: Race test
        env:
          CGO_ENABLED: "1"
        run: go test -mod=readonly -race ./...

  bpf:
    name: eBPF ELF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install BPF compile headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-libc-dev
      - name: Compile and refresh embedded XDP/TCX ELF objects
        run: make bpf
      - name: Verify embedded objects are up to date with C source
        run: git diff --exit-code -- internal/tcebpf/objects/tun_tc.o internal/xdp/objects/xdp_mqvpn.o
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify TCX MSS rewrite and checksums in the kernel
        run: |
          sudo modprobe tun || true
          test -c /dev/net/tun
          sudo env "PATH=$PATH" "HOME=$HOME" CGO_ENABLED=0 go test -mod=readonly -tags bpf_integration -run '^TestKernel' -v ./internal/tcebpf

  tun-integration:
    name: Linux TUN connected-route integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Enable Linux TUN and verify kernel connected route
        run: |
          sudo modprobe tun || true
          test -c /dev/net/tun
          sudo env "PATH=$PATH" "HOME=$HOME" CGO_ENABLED=0 go test -mod=readonly -tags tun_integration -run '^TestIntegration' -v ./internal/tun

  overlay-integration:
    name: QUIC/TCP wire encryption, four-WAN and five-site FRR integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install Linux network tools and official FRRouting stable .deb
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 iputils-ping kmod openssl curl ca-certificates gnupg lsb-release python3 iperf3 tcpdump tshark haproxy
          # Official signed frr-stable channel, NOT the Ubuntu archive package.
          curl -fsSL https://deb.frrouting.org/frr/keys.gpg |
            sudo tee /usr/share/keyrings/frrouting.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/frrouting.gpg] https://deb.frrouting.org/frr noble frr-stable" |
            sudo tee /etc/apt/sources.list.d/frrouting.list
          sudo apt-get update -qq
          apt-cache policy frr | tee /tmp/mqvpn-frr-policy.log
          grep -q 'deb.frrouting.org/frr' /tmp/mqvpn-frr-policy.log
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends frr frr-pythontools
          dpkg -l frr frr-pythontools
          /usr/lib/frr/bgpd --version
          /usr/lib/frr/ospfd --version
      - name: Prepare Linux TUN and VXLAN modules
        run: |
          sudo modprobe tun || true
          sudo modprobe vxlan || true
          test -c /dev/net/tun
          bash -n tests/integration/overlay-netns.sh
          bash -n tests/integration/five-site-frr.sh
          bash -n scripts/mqvpn-ready.sh
          python3 -m py_compile tests/integration/transport_probe.py tests/integration/wan_probe.py tests/integration/wire_crypto_probe.py tests/integration/verify_wire_crypto.py tests/integration/verify_sticky_wire.py tests/integration/check_frr_neighbors.py tests/integration/test_frr_neighbors.py
          python3 -m unittest discover -s tests/integration -p 'test_frr_neighbors.py' -v
      - name: Validate Server-side HAProxy TCP ingress examples
        run: |
          haproxy -c -f configs/haproxy-mqvpn-active-active-tcp.cfg
          haproxy -c -f configs/haproxy-mqvpn-active-standby-tcp.cfg
      - name: Build actual mqvpn binaries
        run: make release
      - name: Verify four WAN QUIC ciphertext using TUN/WAN PCAPs and temporary TLS keys
        run: sudo bash tests/integration/overlay-netns.sh crypto-wan4
      - name: Verify TLS/TCP fallback wire confidentiality using test-only traffic secrets
        run: sudo bash tests/integration/overlay-netns.sh crypto-tcp
      - name: Four independent WAN paths with asymmetric latency and packet loss
        run: sudo bash tests/integration/overlay-netns.sh wan4
      - name: Four heterogeneous WANs with low-RTT scheduling and bounded RTP reorder
        run: sudo bash tests/integration/overlay-netns.sh wan4-latency
      - name: Four-WAN strict Sticky SIP/RTP and WAN0 to WAN1 failover
        run: sudo bash tests/integration/overlay-netns.sh wan4-sticky
      - name: VXLAN MTU 1450 over TUN (ARP, full-MTU DF, both directions)
        run: sudo bash tests/integration/overlay-netns.sh vxlan
      - name: TCP over QUIC TUN (256 KiB bidirectional integrity, both server roles)
        run: sudo bash tests/integration/overlay-netns.sh tcp
      - name: UDP over QUIC TUN (sizes through IPv4 MTU 1500, both server roles)
        run: sudo bash tests/integration/overlay-netns.sh udp
      - name: SIP/RTP/RTCP over QUIC TUN (full-duplex G.711 PCMU, DSCP EF)
        run: sudo bash tests/integration/overlay-netns.sh voip
      - name: VoIP under concurrent bidirectional TCP/UDP load on shaped WAN
        run: sudo bash tests/integration/overlay-netns.sh mixed
      - name: WAN netem regional (RTT 80ms, jitter, 1% loss, concurrent TCP UDP)
        run: sudo bash tests/integration/overlay-netns.sh wan-regional
      - name: WAN netem poor (RTT 240ms, jitter, 3% loss)
        run: sudo bash tests/integration/overlay-netns.sh wan-poor
      # Reuse this job's signed FRR installation, binaries and TUN setup.
      # The previous two-site BGP case duplicates the more complete
      # five-site convergence/FIB/forwarding assertions, so run only these.
      - name: Five-site randomized 1–8 WAN BGP convergence and 20-way forwarding
        env:
          WAN_SEED: ${{ github.run_id }}
        run: sudo env WAN_SEED="$WAN_SEED" bash tests/integration/five-site-frr.sh bgp
      - name: Five-site randomized 1–8 WAN OSPF convergence and 20-way forwarding
        env:
          WAN_SEED: ${{ github.run_id }}
        run: sudo env WAN_SEED="$WAN_SEED" bash tests/integration/five-site-frr.sh ospf
