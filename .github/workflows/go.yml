name: Go
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install eBPF build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev
      - name: Compile multi-instance XDP ELF
        run: make bpf
      - name: Download Go modules
        run: go mod download
      - name: Build pure Go without CGO
        env:
          CGO_ENABLED: "0"
        run: go build -mod=mod ./cmd/...
      - name: Test without CGO
        env:
          CGO_ENABLED: "0"
        run: go test -mod=mod ./...
      - name: Race detector
        run: go test -mod=mod -race ./...
      - name: Vet
        run: go vet -mod=mod ./...
