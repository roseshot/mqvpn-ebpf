name: Go

# PRs run once. Feature-branch pushes previously duplicated pull_request jobs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR revisions; do not cancel other PRs.
concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Go format and module integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Enforce gofmt across all application and test code
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            printf 'Go files requiring gofmt:\n%s\n' "$files"
            # Print an actionable patch for remote cross-platform contributors.
            gofmt -d $files
            exit 1
          fi
      - name: Verify reproducible Go modules
        run: |
          go mod tidy -diff
          go mod verify
      - name: Check local documentation links and heading anchors
        run: python3 scripts/check-doc-links.py

  client-core-cross:
    name: Portable Client Core (Windows macOS Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # This tests reusable protocol/packet processing only. The complete
      # Client executable remains Linux-only until native TUN, routes,
      # underlay socket protection and app lifecycle adapters are present.
      - name: Cross-compile shared Client Core, MPQUIC and packet-pump tests
        run: |
          set -eu
          packages="./internal/p2mp ./internal/l3 ./internal/capsule ./internal/qos ./internal/mtu ./internal/routepush ./internal/dnspush ./internal/logging"
          for target in "windows amd64" "darwin arm64" "android arm64"; do
            set -- $target
            echo "Compiling portable Client Core for GOOS=$1 GOARCH=$2"
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build -mod=readonly $packages
            # Verify the actual QUIC and HTTP/3 dependency, not just our L3 pump.
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build -mod=readonly github.com/qoke/mp-quic-go github.com/qoke/mp-quic-go/http3
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go test -mod=readonly -c -o "$RUNNER_TEMP/mqvpn-client-pump-$1-$2.test" ./internal/p2mp
          done

  windows-client:
    name: Windows Client binary and Wintun packet component
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The Server is intentionally Linux-only; cross-compile only Client.
      - name: Build Windows Client and native Wintun packet component
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          go build -mod=readonly -o "$env:RUNNER_TEMP/mqvpn-client.exe" ./cmd/mqvpn-client
          go build -mod=readonly ./internal/wintun
      - name: Validate Windows Wintun adapter safety without a driver
        shell: pwsh
        run: go test -mod=readonly -v ./internal/wintun
      - name: Refuse an incomplete Windows VPN session before dialing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & "$env:RUNNER_TEMP/mqvpn-client.exe" --server vpn.example.invalid --transport quic 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $output -notmatch 'native VPN network session is not implemented') {
            Write-Error "Windows Client did not fail closed: $output"
            exit 1
          }
          Write-Output "Windows native VPN admission correctly disabled pending route/DNS/underlay integration"
          # PowerShell action wrapper exits with $LASTEXITCODE unless reset.
          # A rejected native VPN startup is the EXPECTED successful test.
          exit 0

  native:
    name: Native Go (CGO=0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build self-contained binaries, test and vet without CGO
        env:
          CGO_ENABLED: "0"
        run: |
          make release
          go test -mod=readonly ./...
          go vet -mod=readonly ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Go's race detector requires CGO on Linux.
      - name: Race test
        env:
          CGO_ENABLED: "1"
        run: go test -mod=readonly -race ./...

  bpf:
    name: eBPF ELF reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install BPF compile headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-libc-dev
      - name: Compile and refresh embedded XDP/TCX ELF objects
        run: make bpf
      - name: Verify embedded objects are up to date with C source
        run: git diff --exit-code -- internal/tcebpf/objects/tun_tc.o internal/xdp/objects/xdp_mqvpn.o

  integration:
    name: Linux integration (eBPF, TUN, QUIC, WAN, FRR)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install Linux network tools and official FRRouting stable .deb
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 iputils-ping kmod openssl curl ca-certificates gnupg lsb-release python3 iperf3 tcpdump tshark haproxy
          # Official signed frr-stable channel, NOT the Ubuntu archive package.
          curl -fsSL https://deb.frrouting.org/frr/keys.gpg |
            sudo tee /usr/share/keyrings/frrouting.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/frrouting.gpg] https://deb.frrouting.org/frr noble frr-stable" |
            sudo tee /etc/apt/sources.list.d/frrouting.list
          sudo apt-get update -qq
          apt-cache policy frr | tee /tmp/mqvpn-frr-policy.log
          grep -q 'deb.frrouting.org/frr' /tmp/mqvpn-frr-policy.log
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends frr frr-pythontools
          dpkg -l frr frr-pythontools
          /usr/lib/frr/bgpd --version
          /usr/lib/frr/ospfd --version
      # All privileged checks now belong to one reproducible scenario.
      # It keeps detailed phase names and fails at the first failed assertion.
      - name: Run complete Linux VPN integration scenario
        env:
          WAN_SEED: ${{ github.run_id }}
        run: sudo env "PATH=$PATH" "HOME=$HOME" WAN_SEED="$WAN_SEED" bash tests/integration/scenario.sh
