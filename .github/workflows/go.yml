name: Go
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go build -mod=mod ./cmd/mqvpn
      - run: go test -mod=mod -race ./...
      - run: go vet -mod=mod ./...
