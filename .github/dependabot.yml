# All supported dependencies are eligible for updates; no ignore rules.
# Checks run every Tuesday at 00:00 UTC.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 100

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 100
